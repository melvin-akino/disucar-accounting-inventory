version: "3.9"

# ── NOTE: No local 'db' container — database is AWS RDS PostgreSQL.
# ── DATABASE_URL / DIRECT_URL are injected via docker-compose.override.yml
# ── (generated by setup-aws.sh) pointing to the RDS endpoint.

services:
  # ── Schema push + seed (runs once, exits) ───────────────────────────────────
  migrate:
    build:
      context: .
      target: builder
    container_name: disucar-sales-migrate
    # `migrate deploy` applies the committed migrations in prisma/migrations and nothing
    # else. It replaced `db push --accept-data-loss`, which inferred the changes at boot
    # and would silently drop a column or table to make the database match the schema —
    # survivable against demo data, not against real orders.
    #
    # Seeding is opt-in: it loads demo customers, catalog and ledger entries, so it must
    # not run against a live database. Set SEED_DEMO_DATA=true for a fresh environment.
    command: >
      sh -c "npx prisma migrate deploy &&
             if [ \"$$SEED_DEMO_DATA\" = \"true\" ]; then npx tsx prisma/seed.ts; else echo 'Skipping demo seed (set SEED_DEMO_DATA=true to load it).'; fi"
    environment:
      TZ: Asia/Manila
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      DATABASE_URL: postgresql://postgres:changeme@localhost:5432/disucar
      DIRECT_URL: postgresql://postgres:changeme@localhost:5432/disucar
      NEXTAUTH_SECRET: demo-secret-for-local-dev-change-in-prod
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # ── Next.js application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disucar-sales-ops
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # Storage stays UTC; this controls rendering and local-day boundary math only.
      TZ: Asia/Manila
      DATABASE_URL: postgresql://postgres:changeme@localhost:5432/disucar
      DIRECT_URL: postgresql://postgres:changeme@localhost:5432/disucar
      NEXTAUTH_SECRET: demo-secret-for-local-dev-change-in-prod
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_NAME: "Disucar Sales ERP"
      NEXT_PUBLIC_APP_ORG: "Disucar Sales Inc"
      NEXT_PUBLIC_ORG_NAME: "Disucar Sales Inc"
      NEXT_PUBLIC_ORG_TAGLINE: "Grocery & FMCG Distribution"
      NEXT_PUBLIC_ORG_ADDRESS: "3F Greenfield Tower, Mandaluyong City, Metro Manila 1550"
      NEXT_PUBLIC_ORG_PHONE: "+63 2 8123 4567"
      NEXT_PUBLIC_ORG_EMAIL: "info@disucarsales.ph"
      NEXT_PUBLIC_ORG_TIN: "123-456-789-000"
      NEXT_PUBLIC_ORG_WEBSITE: "www.disucarsales.ph"
      NEXT_PUBLIC_ORG_COLOR: "#003087"
      NEXT_PUBLIC_ORG_RDO: "044"
      NEXT_PUBLIC_ORG_ZIP: "1550"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  uploads:
